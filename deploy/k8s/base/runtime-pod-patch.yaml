# JSON patches retain each role's command, probes and resource budget while sharing pod plumbing.
- op: add
  path: /spec/template/metadata/labels/app.kubernetes.io~1part-of
  value: django-template
- op: add
  path: /spec/template/metadata/labels/azure.workload.identity~1use
  value: "true"
- op: add
  path: /spec/template/spec/serviceAccountName
  value: backend-runtime
- op: add
  path: /spec/template/spec/imagePullSecrets
  value:
    - name: ghcr-pull
- op: add
  path: /spec/template/spec/containers/0/volumeMounts/-
  value:
    name: key-vault-secrets
    mountPath: /mnt/secrets-store
    readOnly: true
- op: add
  path: /spec/template/spec/initContainers
  value:
    - name: wait-for-migrations
      image: template-backend
      # This process checks the exact release image and settings before the application can start.
      command: [python, -m, config.operations.migration_gate]
      env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: MIGRATION_JOB_NAME
          value: backend-migrate
        # Environment overlays copy these references from the migration Job, avoiding digest drift.
        - name: EXPECTED_MIGRATION_IMAGE
          value: template-backend
        - name: EXPECTED_MIGRATION_CONFIG
          value: backend-config
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi
      volumeMounts:
        # Only this init process receives a narrowly authorized Kubernetes API token.
        - name: migration-api-credentials
          mountPath: /var/run/template-migration-api
          readOnly: true
- op: add
  path: /spec/template/spec/volumes/-
  value:
    name: migration-api-credentials
    projected:
      defaultMode: 0444
      sources:
        - serviceAccountToken:
            path: token
            expirationSeconds: 600
        - configMap:
            name: kube-root-ca.crt
            items:
              - key: ca.crt
                path: ca.crt
- op: add
  path: /spec/template/spec/volumes/-
  value:
    name: key-vault-secrets
    csi:
      driver: secrets-store.csi.k8s.io
      readOnly: true
      volumeAttributes:
        secretProviderClass: backend-runtime-kv
