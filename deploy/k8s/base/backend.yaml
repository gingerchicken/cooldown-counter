apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: backend
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gunicorn
          image: template-backend
          command: [gunicorn, config.wsgi:application]
          args: [--bind, "0.0.0.0:8000", --workers, "2", --timeout, "30", --graceful-timeout, "30", --access-logfile, "-", --worker-tmp-dir, /tmp]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-runtime-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /api/health/
              port: http
              httpHeaders:
                - name: Host
                  value: api.example.invalid
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            # Liveness deliberately avoids PostgreSQL so an outage does not
            # cause every healthy Gunicorn process to restart continuously.
            httpGet:
              path: /api/health/
              port: http
              httpHeaders:
                - name: Host
                  value: api.example.invalid
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/ready/
              port: http
              httpHeaders:
                - name: Host
                  value: api.example.invalid
            periodSeconds: 5
          volumeMounts:
            - name: temporary-files
              mountPath: /tmp
      volumes:
        - name: temporary-files
          emptyDir:
            sizeLimit: 64Mi
