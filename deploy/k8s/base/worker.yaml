apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      automountServiceAccountToken: false
      # Celery receives SIGTERM and may finish a running job before termination.
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: template-backend
          command: [celery, -A, config, worker]
          args: [--loglevel=INFO, --concurrency=2, --hostname=worker@%h]
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-runtime-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            # Inspect only this worker. A reply from another replica must not
            # hide a process that cannot receive tasks from the broker.
            exec:
              command: [sh, -c, "celery -A config inspect ping --destination worker@$HOSTNAME --timeout 5 | grep -q pong"]
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: temporary-files
              mountPath: /tmp
      volumes:
        - name: temporary-files
          emptyDir:
            sizeLimit: 64Mi
