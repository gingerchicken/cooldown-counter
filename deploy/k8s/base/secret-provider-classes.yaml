apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: backend-runtime-kv
spec:
  provider: azure
  parameters:
    # Environment overlays replace these non-secret identifiers before Flux activation.
    usePodIdentity: "false"
    clientID: replace-with-runtime-workload-client-id
    keyvaultName: replace-with-environment-key-vault
    tenantId: replace-with-azure-tenant-id
    objects: |
      array:
        - |
          objectName: replace-with-runtime-django-secret-key
          objectType: secret
          objectAlias: DJANGO_SECRET_KEY
        - |
          objectName: replace-with-runtime-database-url
          objectType: secret
          objectAlias: DATABASE_URL
        - |
          objectName: replace-with-celery-broker-url
          objectType: secret
          objectAlias: CELERY_BROKER_URL
  secretObjects:
    # The CSI mount keeps this synchronized Secret available for Django's environment interface.
    - secretName: backend-runtime-secrets
      type: Opaque
      data:
        - objectName: DJANGO_SECRET_KEY
          key: DJANGO_SECRET_KEY
        - objectName: DATABASE_URL
          key: DATABASE_URL
        - objectName: CELERY_BROKER_URL
          key: CELERY_BROKER_URL
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: backend-migrations-kv
spec:
  provider: azure
  parameters:
    # Migration identity has a separate schema-owner connection and cannot fetch broker credentials.
    usePodIdentity: "false"
    clientID: replace-with-migration-workload-client-id
    keyvaultName: replace-with-environment-key-vault
    tenantId: replace-with-azure-tenant-id
    objects: |
      array:
        - |
          objectName: replace-with-runtime-django-secret-key
          objectType: secret
          objectAlias: DJANGO_SECRET_KEY
        - |
          objectName: replace-with-migration-database-url
          objectType: secret
          objectAlias: DATABASE_URL
  secretObjects:
    - secretName: backend-migration-secrets
      type: Opaque
      data:
        - objectName: DJANGO_SECRET_KEY
          key: DJANGO_SECRET_KEY
        - objectName: DATABASE_URL
          key: DATABASE_URL
