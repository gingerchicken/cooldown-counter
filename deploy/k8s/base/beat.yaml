apiVersion: apps/v1
kind: Deployment
metadata:
  name: beat
spec:
  # Only one scheduler may publish the periodic schedule. Recreate prevents the
  # normal rolling-update overlap between old and new Beat pods.
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: beat
  template:
    metadata:
      labels:
        app: beat
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: beat
          image: template-backend
          command: [celery, -A, config, beat]
          args: [--scheduler, "django_celery_beat.schedulers:DatabaseScheduler", --loglevel=INFO, "--pidfile="]
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-runtime-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # Beat has no HTTP server. Observe scheduler logs and the heartbeat
          # metric rather than adding an unrelated HTTP probe that cannot prove
          # a scheduled task was published or processed successfully.
          volumeMounts:
            - name: temporary-files
              mountPath: /tmp
      volumes:
        - name: temporary-files
          emptyDir:
            sizeLimit: 64Mi
