apiVersion: batch/v1
kind: Job
metadata:
  name: backend-migrate
  annotations:
    # Flux replaces immutable templates. Finish an active migration before promoting another revision.
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app: backend-migrate
        app.kubernetes.io/part-of: django-template
        azure.workload.identity/use: "true"
    spec:
      restartPolicy: Never
      serviceAccountName: backend-migrations
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: template-backend
          # The dedicated entry point migrates without giving runtime processes schema ownership.
          command: [python, -m, config.operations.migrate]
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-migration-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: temporary-files
              mountPath: /tmp
            - name: key-vault-secrets
              mountPath: /mnt/secrets-store
              readOnly: true
      volumes:
        - name: temporary-files
          emptyDir:
            sizeLimit: 64Mi
        - name: key-vault-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: backend-migrations-kv
