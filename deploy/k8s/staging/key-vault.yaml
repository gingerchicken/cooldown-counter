apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: backend-runtime-kv
spec:
  parameters:
    # These are identifiers, never stored secret values. Match the runtime ServiceAccount client ID.
    clientID: replace-with-staging-runtime-client-id
    keyvaultName: replace-with-staging-key-vault
    tenantId: replace-with-azure-tenant-id
    objects: |
      array:
        - |
          objectName: django-template-staging-django-secret-key
          objectType: secret
          objectAlias: DJANGO_SECRET_KEY
        - |
          objectName: django-template-staging-database-url
          objectType: secret
          objectAlias: DATABASE_URL
        - |
          objectName: django-template-staging-celery-broker-url
          objectType: secret
          objectAlias: CELERY_BROKER_URL
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: backend-migrations-kv
spec:
  parameters:
    # Share Django's signing configuration while keeping schema-owner access on its own identity.
    clientID: replace-with-staging-migration-client-id
    keyvaultName: replace-with-staging-key-vault
    tenantId: replace-with-azure-tenant-id
    objects: |
      array:
        - |
          objectName: django-template-staging-django-secret-key
          objectType: secret
          objectAlias: DJANGO_SECRET_KEY
        - |
          objectName: django-template-staging-migration-database-url
          objectType: secret
          objectAlias: DATABASE_URL
