[project]
name = "django-template-backend"
version = "0.1.0"
description = "Django API, Gunicorn, Celery workers, and periodic tasks"
requires-python = ">=3.13,<3.14"
dependencies = [
  "celery[redis]>=5.6,<6",
  "dj-database-url>=3,<4",
  "django>=5.2,<5.3",
  "django-celery-beat>=2.8,<3",
  "djangorestframework>=3.16,<4",
  "drf-spectacular>=0.29,<1",
  "gunicorn>=26.2,<27",
  "psycopg[binary]>=3.2,<4",
  "whitenoise>=6.11,<7",
]

[dependency-groups]
# Test tools and local process watching are excluded from the published runtime image.
dev = [
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "pytest-django>=4.11,<5",
    "ruff>=0.14,<1",
    "watchfiles>=1.3,<2",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.test_settings"
python_files = ["test_*.py"]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.coverage.run]
source = ["accounts", "tracker", "platform_tools", "jobs", "config"]
omit = ["*/migrations/*", "config/test_settings.py", "config/wsgi.py", "config/asgi.py"]
