<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Cooldown Counter entity relationships</title>
<style>
/* Shared theme variables keep this review diagram readable in either appearance. */
:root{font-family:var(--font-sans,system-ui);color:var(--foreground,#e8edf4)}
body{margin:0}svg{display:block;width:100%;height:auto}text{fill:var(--foreground,#e8edf4);font-family:var(--font-sans,system-ui);font-size:11px}.title{font-weight:700;font-size:13px}.box{fill:var(--card,#232831);stroke:var(--border,#59616d);stroke-width:1.5;rx:8}.edge{fill:none;stroke:var(--primary,#d9a541);stroke-width:1.8}.label{fill:var(--muted-foreground,#a6afbd);font-size:10px}.note{font-size:12px;color:var(--muted-foreground,#a6afbd);line-height:1.5}h3{font-size:15px;margin:8px 0}
</style></head><body>
<svg viewBox="0 0 710 785" role="img" aria-label="ER diagram: fleets authorize users through memberships and own Steam accounts and offence types. Versioned policies contain ladder steps and assess cooldown events. Events have multiple observations. Fleet audit entries retain actor attribution.">
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="var(--primary,#d9a541)"/></marker></defs>
<!-- One fleet authorizes many memberships; each membership names one Django user. -->
<path class="edge" d="M215 70H260" marker-end="url(#arrow)"/><text class="label" x="224" y="60">1:N</text>
<path class="edge" d="M455 70H500" marker-end="url(#arrow)"/><text class="label" x="465" y="60">N:1</text>
<rect class="box" x="20" y="15" width="195" height="120"/><text class="title" x="33" y="38">Fleet</text><text x="33" y="61">PK id: UUID</text><text x="33" y="80">name</text><text x="33" y="99">created_at</text>
<rect class="box" x="260" y="15" width="195" height="120"/><text class="title" x="273" y="38">Membership</text><text x="273" y="61">FK fleet, FK user</text><text x="273" y="80">owner / editor / viewer</text><text x="273" y="99">unique (fleet, user)</text>
<rect class="box" x="500" y="15" width="195" height="120"/><text class="title" x="513" y="38">Django User</text><text x="513" y="61">PK id</text><text x="513" y="80">username, password hash</text><text x="513" y="99">sessions owned by Django</text>
<!-- Tenant ownership is explicit rather than inferred from whoever entered a record. -->
<path class="edge" d="M115 135V205" marker-end="url(#arrow)"/><text class="label" x="124" y="174">1:N</text>
<rect class="box" x="20" y="205" width="195" height="150"/><text class="title" x="33" y="228">SteamAccount</text><text x="33" y="251">PK id: UUID / FK fleet</text><text x="33" y="270">steam_id: exact digit string</text><text x="33" y="289">tag, archived_at</text><text x="33" y="308">history_revision</text><text x="33" y="327">unique (fleet, steam_id)</text>
<path class="edge" d="M215 260H260" marker-end="url(#arrow)"/><text class="label" x="224" y="250">1:N</text>
<rect class="box" x="260" y="205" width="195" height="150"/><text class="title" x="273" y="228">CooldownEvent</text><text x="273" y="251">PK id / FK account, policy</text><text x="273" y="270">started_at, expires_at</text><text x="273" y="289">saved step + total + transition</text><text x="273" y="308">override reason, created_by</text><text x="273" y="327">immutable assessment</text>
<path class="edge" d="M455 260H500" marker-end="url(#arrow)"/><text class="label" x="465" y="250">1:N</text>
<rect class="box" x="500" y="205" width="195" height="150"/><text class="title" x="513" y="228">Observation</text><text x="513" y="251">PK id / FK event</text><text x="513" y="270">observed_at</text><text x="513" y="289">remaining_minutes</text><text x="513" y="308">created_by, created_at</text><text x="513" y="327">does not advance a ladder</text>
<!-- Publishing a new policy leaves every historical assessment on its original version. -->
<path class="edge" d="M30 135H7V505H20" marker-end="url(#arrow)"/><text class="label" x="16" y="400">fleet 1:N</text>
<rect class="box" x="20" y="445" width="195" height="150"/><text class="title" x="33" y="468">OffenceType</text><text x="33" y="491">PK id / FK fleet</text><text x="33" y="510">name, code, note</text><text x="33" y="529">archived_at</text><text x="33" y="548">stable identity on rename</text><text x="33" y="567">archive preserves history</text>
<path class="edge" d="M215 505H260" marker-end="url(#arrow)"/><text class="label" x="224" y="495">1:N</text>
<rect class="box" x="260" y="445" width="195" height="150"/><text class="title" x="273" y="468">PolicyVersion</text><text x="273" y="491">PK id / FK offence_type</text><text x="273" y="510">number, decay_mode</text><text x="273" y="529">clean_window_days</text><text x="273" y="548">created_by, created_at</text><text x="273" y="567">immutable after publication</text>
<path class="edge" d="M355 445V355" marker-end="url(#arrow)"/><text class="label" x="365" y="397">1:N assesses</text>
<path class="edge" d="M455 505H500" marker-end="url(#arrow)"/><text class="label" x="465" y="495">1:N</text>
<rect class="box" x="500" y="445" width="195" height="150"/><text class="title" x="513" y="468">LadderStep</text><text x="513" y="491">FK policy</text><text x="513" y="510">position: one-based</text><text x="513" y="529">duration_minutes: positive</text><text x="513" y="548">unique (policy, position)</text><text x="513" y="567">ordered, nonempty ladder</text>
<path class="edge" d="M7 505V710H260" marker-end="url(#arrow)"/><text class="label" x="30" y="701">fleet 1:N</text>
<rect class="box" x="260" y="650" width="195" height="120"/><text class="title" x="273" y="673">AuditEntry</text><text x="273" y="696">FK fleet, FK actor</text><text x="273" y="715">action, subject_id, details</text><text x="273" y="734">created_at</text>
</svg>
<p class="note">User attribution also links policy versions, events, observations and audit entries to Django users. All instants are UTC. Historical references are protected; published policies and event assessments are retained.</p>
</body></html>
