# The local stack shares a development image so task reloaders stay inside Docker.
# The E2E overlay and GHCR publication explicitly select the production runtime target.
x-backend: &backend
  image: ${COMPOSE_PROJECT_NAME:-django-template}-backend:local
  build:
    context: ./backend
    target: development
  environment: &backend-environment
    # These defaults are public local-only credentials, never production settings.
    DJANGO_DEBUG: "true"
    DJANGO_SECRET_KEY: local-development-only-do-not-use-in-production
    DATABASE_URL: postgresql://template:template@db:5432/template
    CELERY_BROKER_URL: redis://redis:6379/0
    DJANGO_ALLOWED_HOSTS: backend,localhost,127.0.0.1,web
    DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:${LOCAL_WEB_PORT:-8788},http://localhost:${LOCAL_DEV_PORT:-5173},http://127.0.0.1:${LOCAL_WEB_PORT:-8788},http://127.0.0.1:${LOCAL_DEV_PORT:-5173},http://web:8788
    DJANGO_SECURE_COOKIES: "false"
    BEAT_INTERVAL_SECONDS: "60"
    # Polling observes host edits through Docker Desktop and WSL bind mounts.
    WATCHFILES_FORCE_POLLING: "${DEV_WATCH_POLLING:-true}"
  init: true
  # Source is visible to development processes without replacing installed tools.
  volumes:
    - ./backend:/app/backend:ro

x-frontend-development: &frontend-development
  image: ${COMPOSE_PROJECT_NAME:-django-template}-frontend-dev:local
  build:
    context: .
    dockerfile: frontend/Dockerfile
    target: development
  init: true
  # Match writable source ownership on Linux, including GitHub-hosted runners.
  # The local entry script assigns the dependency volume to this identity first.
  user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
  # Dependency storage stays inside Docker while generated source stays reviewable.
  volumes:
    - ./frontend:/app/frontend
    - frontend_node_modules:/app/frontend/node_modules
    - ./backend/openapi.json:/app/backend/openapi.json:ro

services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: template
      POSTGRES_USER: template
      POSTGRES_PASSWORD: template
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U template -d template"]
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-bookworm
    command: [redis-server, --appendonly, "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 5s
      retries: 30

  migrate:
    <<: *backend
    command: [python, manage.py, migrate, --noinput]
    depends_on:
      db:
        condition: service_healthy

  backend:
    <<: *backend
    # A directory watcher also catches edits made during worker startup and new Python modules.
    command: [watchfiles, --filter, python, --ignore-paths, ".venv,staticfiles,tests", --sigint-timeout, "30", "gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --access-logfile -", .]
    stop_grace_period: 45s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/ready/', timeout=3)"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s

  worker:
    <<: *backend
    # Restart the worker after application edits, allowing current work a warm shutdown.
    command: [watchfiles, --filter, python, --ignore-paths, ".venv,staticfiles,tests", --sigint-timeout, "30", "celery -A config worker --loglevel=INFO --concurrency=2 --hostname=worker@%h", .]
    stop_grace_period: 45s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      # Target only this container so a different worker cannot mask its failure.
      test: [CMD-SHELL, "celery -A config inspect ping --destination worker@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 10s

  beat:
    <<: *backend
    # Stop the old scheduler before starting its replacement so ticks cannot overlap.
    command: [watchfiles, --filter, python, --ignore-paths, ".venv,staticfiles,tests", --sigint-timeout, "30", "celery -A config beat --scheduler django_celery_beat.schedulers:DatabaseScheduler --loglevel=INFO --pidfile=", .]
    stop_grace_period: 45s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    image: ${COMPOSE_PROJECT_NAME:-django-template}-web:local
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: web
    init: true
    # Explicit local bindings leave committed production Wrangler settings secure.
    command: [npx, wrangler, pages, dev, dist, --ip, "0.0.0.0", --port, "8788", --binding, "BACKEND_ORIGIN=http://backend:8000", --binding, "ALLOW_INSECURE_BACKEND=true"]
    environment:
      WRANGLER_SEND_METRICS: "false"
      # Wrangler watches both Function routes and imported proxy source through the mounts.
      CHOKIDAR_USEPOLLING: "${DEV_WATCH_POLLING:-true}"
      CHOKIDAR_INTERVAL: "500"
    volumes:
      # Preserve built static assets while exposing only the server-side source to Wrangler.
      - ./frontend/functions:/app/frontend/functions:ro
      - ./frontend/src/platform:/app/frontend/src/platform:ro
    ports:
      # Keep public local credentials on the host loopback interface by default.
      - "${LOCAL_BIND_IP:-127.0.0.1}:${LOCAL_WEB_PORT:-8788}:8788"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:8788/api/health/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s

  vite:
    <<: *frontend-development
    command: [npm, run, dev, --, --host, "0.0.0.0", --port, "5173"]
    environment:
      API_PROXY_ORIGIN: http://web:8788
      HOME: /tmp
      DEV_WATCH_POLLING: "${DEV_WATCH_POLLING:-true}"
    ports:
      - "${LOCAL_BIND_IP:-127.0.0.1}:${LOCAL_DEV_PORT:-5173}:5173"
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      # Wait through client generation and Vite startup before reporting the app ready.
      test: [CMD, node, -e, "fetch('http://localhost:5173/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s

  backend-test:
    <<: *backend
    profiles: [test]
    image: ${COMPOSE_PROJECT_NAME:-django-template}-backend-dev:local
    build:
      context: ./backend
      target: development
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      <<: *backend-environment
      # Tool caches must remain writable when matching the checkout owner's UID.
      UV_CACHE_DIR: /tmp/uv-cache
      RUFF_CACHE_DIR: /tmp/ruff-cache
      PYTEST_ADDOPTS: -o cache_dir=/tmp/pytest-cache
    command: [pytest]
    volumes:
      - ./backend:/app/backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend-test:
    <<: *frontend-development
    profiles: [test]
    # Unit tests and generation need Node only. The separate e2e image owns browsers.
    command: [npm, run, test:unit]
    environment:
      CI: "true"
      WRANGLER_SEND_METRICS: "false"
      HOME: /tmp

  e2e:
    profiles: [test]
    image: ${COMPOSE_PROJECT_NAME:-django-template}-e2e:local
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: e2e
    init: true
    # Shared memory avoids Chromium renderer failures in larger story suites.
    shm_size: 1gb
    command: [npm, run, test:e2e]
    environment:
      BASE_URL: http://web:8788
      CI: "true"
    volumes:
      - ./frontend/playwright-report:/app/frontend/playwright-report
      - ./frontend/test-results:/app/frontend/test-results
    depends_on:
      web:
        condition: service_healthy
      worker:
        condition: service_healthy
      beat:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  frontend_node_modules:
